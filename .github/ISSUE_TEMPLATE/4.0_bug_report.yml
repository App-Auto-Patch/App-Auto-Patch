name: 4.0 Bug Report
description: Something in AppAutoPatch isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        **Before submitting, please attach a diagnostic bundle.** It's the
        single most useful artifact for triage:

        1. Open AppAutoPatch.
        2. Settings → About → Diagnostics → **Generate Diagnostic Bundle**.
        3. Drag the resulting `.zip` from your Desktop into this issue.

        The bundle is local-only — no telemetry — and webhook URLs are
        redacted before it's written.

  - type: input
    id: app-version
    attributes:
      label: AppAutoPatch version
      description: From AppAutoPatch → Settings → About (top of the page).
      placeholder: "e.g. 4.0.0 (10)"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: From  → About This Mac, or `sw_vers -productVersion`.
      placeholder: "e.g. 15.4"
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true

  - type: dropdown
    id: managed
    attributes:
      label: MDM-managed?
      description: Is this Mac receiving an `xyz.techitout.appAutoPatch` configuration profile?
      options:
        - "No (consumer / unmanaged)"
        - "Yes (MDM-managed)"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the unexpected behavior.
      placeholder: |
        Example: After upgrading AppAutoPatch to 4.0.0 build 10, the
        background patcher stopped firing. Clicking *Update All* still
        works.
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What did you expect to happen?
      placeholder: |
        Example: A background pass to fire roughly every 4 hours and
        post a completion notification.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered steps make this much easier to act on.
      placeholder: |
        1. Install AppAutoPatch-4.0.0.pkg
        2. Approve the helper
        3. Set BackgroundPatchClosedAppsScheduler to "helper"
        4. Wait 4+ hours
        5. Observe …
    validations:
      required: true

  - type: textarea
    id: diagnostic-bundle
    attributes:
      label: Diagnostic bundle
      description: |
        Drag-and-drop the `AppAutoPatch-Diagnostic-*.zip` from your
        Desktop into the area below. (GitHub will accept zip
        attachments here.)
    validations:
      required: false

  - type: textarea
    id: extras
    attributes:
      label: Anything else
      description: Screenshots, log excerpts, prior workarounds, etc.
